<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFun | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="logo">
            <h1>F<span>oo</span>dFun</h1>
            <p>Welcome Back 👋</p>
        </div>

        <form>

            <div class="input-box">
                <label>Email Address</label>
                <input
                type="email"
                placeholder="Enter your email">
            </div>

            <div class="input-box">
                <label>Password</label>

                <div class="password-box">
                    <input
                    id="password"
                    type="password"
                    placeholder="Enter password">

                    <button
                    type="button"
                    id="togglePassword">
                        👁
                    </button>

                </div>

            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button class="login-btn">
                Login
            </button>

            <button class="guest-btn">
                Continue as Guest
            </button>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </form>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
