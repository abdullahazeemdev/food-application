<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodFun | Login</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">
            <h1>F<span>oo</span>dFun</h1>
            <p>Welcome Back 👋</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">

            <!-- Email -->
            <div class="input-box">

                <label for="email">
                    <i class="fa-solid fa-envelope"></i>
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <!-- Password -->
            <div class="input-box">

                <label for="password">
                    <i class="fa-solid fa-lock"></i>
                    Password
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter password"
                        required>

                    <button
                        type="button"
                        id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <!-- Options -->
            <div class="options">

                <label>

                    <input
                        type="checkbox"
                        id="remember">

                    Remember Me

                </label>

                <a href="forgot.html">
                    Forgot Password?
                </a>

            </div>

            <!-- Login -->
            <button
                type="submit"
                class="login-btn"
                id="login">

                <i class="fa-solid fa-right-to-bracket"></i>
                Login

            </button>

            <!-- Guest -->
            <button
                type="button"
                class="guest-btn"
                id="guestBtn">

                <i class="fa-solid fa-user"></i>
                Continue as Guest

            </button>

            <!-- Signup -->
            <p class="signup">

                Don't have an account?

                <a href="../Signup/signup.html">
                    Create Account
                </a>

            </p>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="app.js"></script>

</body>
</html>
