    <title>Food Menu</title>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-white duration-300">
    <!-- Heading -->
    <section class="py-10">
        <h1 class="text-5xl font-extrabold text-center mb-3">
         F<span class="logo-oo text-yellow-500">oo</span>dFun Menu
        </h1>

        <p class="text-center text-gray-400 text-lg mt-10 mb-10 max-w-2xl mx-auto leading-8">
        At <span class="text-yellow-400 font-semibold">FoodFun</span>, every meal is crafted with fresh ingredients, rich flavors, and a passion for creating unforgettable dining experiences.
        </p>

<div class="max-w-7xl mx-auto px-5 mb-10">

    <div class="flex flex-col lg:flex-row items-center justify-between gap-6
    bg-slate-900/70
    backdrop-blur-xl
    border border-yellow-400/30
    rounded-3xl
    px-8 py-6
    shadow-[0_10px_30px_rgba(0,0,0,0.4)]
    hover:border-yellow-300
    hover:shadow-[0_0_25px_rgba(250,204,21,0.4),0_0_60px_rgba(250,204,21,0.2)]
    hover:bg-slate-800/80
    hover:-translate-y-1
    transition-all
    duration-500
    ease-out">


        <!-- Categories -->
        <div id="categories" class="flex flex-wrap gap-4">

            <button class="category-btn border border-yellow-400 px-5 py-2 rounded-full font-medium hover:bg-yellow-400 hover:text-white duration-300" id="all">
                All
            </button>

            <button class="category-btn border border-yellow-400 px-5 py-2 rounded-full font-medium hover:bg-yellow-400 hover:text-white duration-300" id="breakfast">
                Breakfast
            </button>

            <button class="category-btn border border-yellow-400 px-5 py-2 rounded-full font-medium hover:bg-yellow-400 hover:text-white duration-300" id="lunch">
                Lunch
            </button>

            <button class="category-btn border border-yellow-400 px-5 py-2 rounded-full font-medium hover:bg-yellow-400 hover:text-white duration-300" id="drinks">
                Drinks
            </button>

            <button class="category-btn border border-yellow-400 px-5 py-2 rounded-full font-medium hover:bg-yellow-400 hover:text-white duration-300" id="dinner">
                Dinner
            </button>

            <button class="category-btn border border-yellow-400 px-5 py-2 rounded-full font-medium hover:bg-yellow-400 hover:text-white duration-300" id="dessert">
                Dessert
            </button>

            <button class="category-btn border border-yellow-400 px-5 py-2 rounded-full font-medium hover:bg-yellow-400 hover:text-white duration-300" id="salad">
                Salad
            </button>

        </div>

        <!-- Search -->
        <div class="flex w-full lg:w-[420px]">

            <input
                id="search"
                type="text"
                placeholder="Search your favorite food..."
                class="flex-1 px-5 py-3 bg-slate-800 border border-gray-600 rounded-l-full outline-none focus:border-yellow-400"
            >

            <button
                id="searchBtn"
                class="px-6 py-3 bg-yellow-400 text-black rounded-r-full font-semibold hover:bg-yellow-500 duration-300">
                Search
            </button>

        </div>

    </div>

</div>
