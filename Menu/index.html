<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodFun | Menu</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-white duration-300">

    <!-- ================= Heading ================= -->

    <section class="py-10">

        <h1 class="text-5xl font-extrabold text-center mb-3">
            F<span class="text-yellow-500">oo</span>dFun Menu
        </h1>

        <p class="text-center text-gray-400 text-lg mt-10 mb-10 max-w-2xl mx-auto leading-8">
            At <span class="text-yellow-400 font-semibold">FoodFun</span>, every meal is crafted with fresh
            ingredients,
            rich flavors, and a passion for creating unforgettable dining experiences.
        </p>

        <!-- ================= Filter ================= -->

        <div class="max-w-7xl mx-auto px-5 mb-10">

            <div
                class="flex flex-col lg:flex-row items-center justify-between gap-6 bg-slate-900/70 backdrop-blur-xl border border-yellow-400/30 rounded-3xl px-8 py-6">

                <!-- Categories -->

                <div id="categories" class="flex flex-wrap gap-4">

                    <button id="all"
                        class="category-btn border border-yellow-400 px-5 py-2 rounded-full hover:bg-yellow-400 hover:text-black duration-300">
                        All
                    </button>

                    <button id="breakfast"
                        class="category-btn border border-yellow-400 px-5 py-2 rounded-full hover:bg-yellow-400 hover:text-black duration-300">
                        Breakfast
                    </button>

                    <button id="lunch"
                        class="category-btn border border-yellow-400 px-5 py-2 rounded-full hover:bg-yellow-400 hover:text-black duration-300">
                        Lunch
                    </button>

                    <button id="drinks"
                        class="category-btn border border-yellow-400 px-5 py-2 rounded-full hover:bg-yellow-400 hover:text-black duration-300">
                        Drinks
                    </button>

                    <button id="dinner"
                        class="category-btn border border-yellow-400 px-5 py-2 rounded-full hover:bg-yellow-400 hover:text-black duration-300">
                        Dinner
                    </button>

                    <button id="dessert"
                        class="category-btn border border-yellow-400 px-5 py-2 rounded-full hover:bg-yellow-400 hover:text-black duration-300">
                        Dessert
                    </button>

                    <button id="salad"
                        class="category-btn border border-yellow-400 px-5 py-2 rounded-full hover:bg-yellow-400 hover:text-black duration-300">
                        Salad
                    </button>

                </div>

                <!-- Search -->

                <div class="flex w-full lg:w-[420px]">

                    <input id="search" type="text" placeholder="Search your favorite food..."
                        class="flex-1 px-5 py-3 bg-slate-800 border border-gray-600 rounded-l-full outline-none focus:border-yellow-400">

                    <button id="searchBtn"
                        class="px-6 py-3 bg-yellow-400 text-black rounded-r-full font-semibold hover:bg-yellow-500 duration-300">
                        Search
                    </button>

                </div>

            </div>

        </div>

        <!-- ================= Menu ================= -->

        <div id="menu-container"
            class="max-w-7xl mx-auto px-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

        </div>

    </section>

    <!-- ================= Floating View Cart ================= -->

    <div id="viewCartBar" class="view-cart-bar">

        <div class="cart-left">

            <i class="fa-solid fa-cart-shopping"></i>

            <div>

                <h3>View Cart</h3>

                <span id="cartItemsCount">0 Items</span>

            </div>

        </div>

        <button onclick="goToCart()">

            View Cart

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

    <!-- ================= Footer ================= -->

    <footer class="text-center py-8 text-gray-500">

        © 2026 FoodFun | Made by Abdullah Azeem

    </footer>

    <!-- ================= Scripts ================= -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="data.js"></script>

    <script src="app.js"></script>

</body>

</html>
